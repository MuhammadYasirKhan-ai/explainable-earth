[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-earth"
version = "1.0.0"
description = "Explainable trend detection on NASA GISTEMP surface temperature data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "streamlit>=1.35", "plotly>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "mypy>=1.10", "ruff>=0.5", "pandas-stubs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explainable_earth = ["data/*.csv", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "plotly.*", "streamlit.*"]
ignore_missing_imports = true
